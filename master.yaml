# Master source of truth for the Baselight ErgoDox macropads.
# Edit THIS file, then run scripts/sync.py (see README). Key names: 1A..7E / R1A..R7E / T1..T6 / RT1..RT6.
# layers.N: fn = what it does; key = keystroke sent (or macro:); hold = hold action; oryx = Oryx label (<=10 chars);
#           cap = keycap legend (L0 <= ~5 chars on 1u keys, variants <= 7). Omit a layer to leave it transparent.
layout:
  name: Ergodox Baselight V16
  oryx_hash: Y6DDQ
  oryx_geometry: ergodox-ez-st
  oryx_revision: 3vAb4w
  yuzu_name: Baselight V16
style:
  profile: kam
  cap_color: GR002
  ink:
    '0': GR001
    '1': RD003
    '2': GN010
    '3': BL023
  font_label: 26345
  font_big: 26415   # HelvNow Cn300 BL (Light, width 70): stem matches the arrow icons' 0.53 mm stroke
  cap_mm_l0: 3.2       # Layer 0 (shrinks to fit on wide words)
  cap_mm_var: 2.25     # Layer 1/2
  top_y: -5.2
  gap_after_l0: 1.7   # L1/L2 pushed down 0.5 so the L0 word has air (L2 bottom at +5.0, corner letter to +5.2)
  gap_var: 0.8
  # Layer 3 is not a slot any more: a one-letter cap is printed as a small blue letter in the bottom-right corner
  # (the layer it jumps to); an empty cap means unlabelled.
  l3_corner_mm: 1.5
  l3_corner_inset: 0.5
  cap_ratio: 0.712
  big_cap_max_mm: 6.5
  big_keys:
  - R4A
  - R5A
  - R6A
  - R7A
  - R4B
  - R5B
  - R6B
  - R7B
  - R2C
  - R4C
  - R5C
  - R6C
  - R7C
  - R1D
  - R2D
  - R3D
  - R4D
  - R5D
  - R6D
  - R5E
  - R6E
